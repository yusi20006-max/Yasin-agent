[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-agent"
dynamic = ["version"]
description = "Yasin-Agent: agent runtime platform for the Yasin AI Ecosystem, built on Yasin-Core's public SDK"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.24.0",
]
test = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]
test-server = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.24.0",
]

[project.scripts]
yasin-agent-server = "agent_platform.server.app:main"

[tool.setuptools.dynamic]
version = {attr = "agent_platform.__version__"}

[tool.setuptools.packages.find]
include = ["agent_platform*"]
