[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasin-agent"
dynamic = ["version"]
description = "Yasin-Agent: agent runtime platform for the Yasin AI Ecosystem, built on Yasin-Core's public SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click",
]

[tool.setuptools.dynamic]
version = {attr = "agent_platform.__version__"}

[tool.setuptools.packages.find]
include = ["agent_platform*"]
